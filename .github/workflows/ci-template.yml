name: CI Template

on:
  workflow_call:
    inputs:
      service-name:
        required: true
        type: string
    secrets:
      GEMINI_API_KEY:
        required: true

jobs:
  build-and-review:
    runs-on: ubuntu-latest

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Java 21 설정
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'corretto'

      - name: Gradle 캐시 설정
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles(format('{0}/**/*.gradle*', inputs.service-name)) }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Gradle 빌드
        working-directory: ${{ inputs.service-name }}
        run: ./gradlew build -x test

      - name: 프롬프트 파일 읽기
        id: read-prompt
        run: |
          PROMPT=$(cat .github/prompts/code-review.md)
          echo "prompt<<EOF" >> $GITHUB_OUTPUT
          echo "$PROMPT" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: AI 코드리뷰 (Gemini)
        continue-on-error: true
        uses: actions/github-script@v7
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SERVICE_NAME: ${{ inputs.service-name }}
          REVIEW_PROMPT: ${{ steps.read-prompt.outputs.prompt }}
        with:
          script: |
            const { execSync } = require('child_process');

            const serviceName = process.env.SERVICE_NAME;
            const prompt = process.env.REVIEW_PROMPT;
            const baseBranch = context.payload.pull_request.base.ref;

            const diff = execSync(
              `git diff origin/${baseBranch}...HEAD -- ${serviceName}/`
            ).toString();

            if (!diff) {
              console.log('변경된 파일 없음, 코드리뷰 스킵');
              return;
            }

            const requestBody = {
              contents: [
                {
                  parts: [
                    {
                      text: `${prompt}\n\n\`\`\`diff\n${diff.slice(0, 8000)}\n\`\`\``
                    }
                  ]
                }
              ],
              generationConfig: {
                maxOutputTokens: 1024
              }
            };

            const response = await fetch(
              `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${process.env.GEMINI_API_KEY}`,
              {
                method: 'POST',
                headers: {
                  'Content-Type': 'application/json'
                },
                body: JSON.stringify(requestBody)
              }
            );

            if (!response.ok) {
              const error = await response.json();
              console.error('Gemini API 에러:', JSON.stringify(error));
              return;
            }

            const data = await response.json();
            const review = data.candidates[0].content.parts[0].text;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `## 🤖 AI 코드리뷰 (${serviceName})\n\n${review}`
            });