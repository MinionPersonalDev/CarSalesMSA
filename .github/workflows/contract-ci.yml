name: Contract Service CI

on:
  pull_request:
    branches:
      - develop
      - main
    paths:
      - 'contract-service/**'

permissions:
  pull-requests: write
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci-template.yml
    with:
      service-name: contract-service
    secrets:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}